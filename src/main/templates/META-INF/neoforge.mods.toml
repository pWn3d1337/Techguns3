modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/pWn3d1337/Techguns3/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/pWn3d1337/Techguns3"
credits="Based on Techguns 2 (1.12.2) by pWn3d_1337 and Th3_St4lk3r and on the Techguns Fabric port"
# Techguns arm poses (client)
enumExtensions="META-INF/enumextensions.json"
description='''
Guns, armor, machines, NPCs and structures. Techguns 3 is the port of Techguns 2 (1.12.2): over 40 guns with ammo, upgrades and effects, powered armor and gear, machines and multiblocks on Forge Energy, NPC factions and bosses, radiation and new world generation.

Optional: Curios (extra slots), JEI (machine recipes), Patchouli or Modonomicon (guide book).
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},)"
    ordering="NONE"
    side="BOTH"

# Extra slots for face/back/hand gear; without Curios Techguns uses its own slots
[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[${curios_version},)"
    ordering="NONE"
    side="BOTH"
