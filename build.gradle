plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    // CurseForge, Modrinth and GitHub uploads (9g); publishMods runs as a dry run without tokens
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude development-only resources from finalized outputs
    exclude("**/*.bbmodel") // Blockbench project files
    exclude(".cache/**") // datagen cache files (paths are relative to the resource dirs)
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'FTB'
                url = 'https://maven.ftb.dev/releases'
            }
        }
        filter {
            includeGroup 'dev.ftb.mods'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter {
            includeGroup 'software.bernie.geckolib'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Curios'
                url = 'https://maven.theillusivec4.top/'
            }
        }
        filter {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared (JEI)'
                url = 'https://maven.blamejared.com/'
            }
        }
        filter {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // dev window (windowed, so MCP testing doesn't take over the screen)
            programArguments.addAll '--width', '2560', '--height', '1080'
        }

        // second player for multiplayer checks: run with -Puse_mcpfabric=false next to runServer and runClient
        // (own game dir, no bridge); joins the local dedicated server directly
        client2 {
            client()
            gameDirectory = project.file('run2')
            programArguments.addAll '--username', 'Dev2', '--width', '1280', '--height', '720', '--quickPlayMultiplayer', 'localhost'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Launches GameTestServer, runs all registered gametests, then exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            // Techguns 2 conversion inputs (structures, chest loot), see src/legacy/README.md
            systemProperty 'techguns.legacyDir', file('src/legacy').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime': present for dev runs, but never pulled by dependents of this mod or shipped.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Plain unit tests for Minecraft-free logic in techguns.core
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Gun (and later NPC/machine) models and animations, design doc Q3
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Extra slots (face/back/hand), optional (design doc Q5): compiled against, present in dev runs, not required
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Recipe viewer, optional (design doc Q9): the plugin in techguns.compat.jei only loads with JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Guide book, optional, both supported (8d): the manual is generated for each, players get it with either mod
    localRuntime "maven.modrinth:patchouli:${patchouli_version}"
    compileOnly "maven.modrinth:modonomicon:${modonomicon_version}"
    localRuntime "maven.modrinth:modonomicon:${modonomicon_version}"

    // Mekanism, optional (8f2): the radiation bridge uses its API (in the mod jar); dev runtime with compat_mods
    compileOnly("maven.modrinth:mekanism:${compat_mekanism}") { transitive = false }

    // Team mods, optional (8f1): compat/team providers compile against them and load only when the mod is there
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    compileOnly("maven.modrinth:open-parties-and-claims:${opac_version}") { transitive = false }

    if (project.use_mcpfabric.toBoolean()) {
        localRuntime("maven.modrinth:mcpfabric:${mcpfabric_version}") { transitive = false }
    }

    // Tier 2 compat check (8e), opt-in with -Pcompat_mods=true: the mods whose machines get conditional Techguns
    // recipes, so the GameTests can check those recipes load (Modrinth version ids, see gradle.properties)
    if (project.compat_mods.toBoolean()) {
        ["create", "mekanism", "immersiveengineering", "modern-industrialization", "oritech",
         "guideme", "architectury-api", "athena-ctm"].each { slug ->
            localRuntime("maven.modrinth:${slug}:${project.property('compat_' + slug.replace('-', '_'))}") { transitive = false }
        }
        // team mods (8f1); FTB Teams also needs Architectury (above)
        localRuntime("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
        localRuntime("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    }
    // Decorative block mods (9i), opt-in with -Pdecor_mods=true: Factory Blocks, Chisel Reborn and Laboratory Blocks for the
    // structure blocks, Rechiseled for the chiseling groups (Modrinth version ids, see gradle.properties)
    if (project.decor_mods.toBoolean()) {
        ["rechiseled", "supermartijn642s-core-lib", "supermartijn642s-config-lib", "fusion-connected-textures", "chisel-reborn",
         "cryonicconfig", "factory-blocks", "artemis-laboratory-blocks"].each { slug ->
            localRuntime("maven.modrinth:${slug}:${project.property('decor_' + slug.replace('-', '_'))}") { transitive = false }
        }
        if (!project.compat_mods.toBoolean()) {
            localRuntime("maven.modrinth:architectury-api:${compat_architectury_api}") { transitive = false }
        }
    }
    // Open Parties and Claims on its own (-Popac=true): it crashes the GameTest server (no profile cache there),
    // so check it in the dev client (/tgdebug teams)
    if (project.opac.toBoolean()) {
        localRuntime("maven.modrinth:open-parties-and-claims:${opac_version}") { transitive = false }
    }
}

// Expands the declared properties in src/main/templates (neoforge.mods.toml).
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_min_version        : neo_min_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            geckolib_version       : geckolib_version,
            curios_version         : curios_version,
            patchouli_version      : patchouli_version,
            modonomicon_version    : modonomicon_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

// Release (9g): ./gradlew publishMods uploads the jar to CurseForge, Modrinth and GitHub with the CHANGELOG.md
// section of this version. Without the tokens or the project ids (gradle.properties) it is a dry run that writes
// the release into build/publishMods. The release workflow (.github/workflows/release.yml) runs it on demand.
var releaseVersion = mod_version
var releaseChangelog = providers.fileContents(layout.projectDirectory.file('CHANGELOG.md')).asText.map { text ->
    var section = text =~ /(?ms)^## \[\Q${releaseVersion}\E\][^\n]*\n(.*?)(?=^## \[|\z)/
    section.find() ? section.group(1).trim() : "See CHANGELOG.md"
}
var curseforgeToken = providers.environmentVariable('CURSEFORGE_TOKEN')
var modrinthToken = providers.environmentVariable('MODRINTH_TOKEN')
var githubToken = providers.environmentVariable('GITHUB_TOKEN')

publishMods {
    file = jar.archiveFile
    changelog = releaseChangelog
    version = mod_version
    displayName = "${mod_name} ${mod_version} (${minecraft_version})"
    type = mod_version.contains('alpha') ? ALPHA : mod_version.contains('beta') ? BETA : STABLE
    modLoaders.add('neoforge')
    dryRun = !curseforgeToken.isPresent() || !modrinthToken.isPresent() || !githubToken.isPresent()
            || curseforge_project_id.isEmpty() || modrinth_project_id.isEmpty()

    curseforge {
        projectId = curseforge_project_id.isEmpty() ? '0' : curseforge_project_id
        accessToken = curseforgeToken
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        client = true
        server = true
        requires('geckolib')
        optional('curios', 'jei', 'patchouli', 'modonomicon')
    }
    modrinth {
        projectId = modrinth_project_id.isEmpty() ? '00000000' : modrinth_project_id
        accessToken = modrinthToken
        minecraftVersions.add(minecraft_version)
        requires('geckolib')
        optional('curios', 'jei', 'patchouli', 'modonomicon')
    }
    github {
        repository = 'pWn3d1337/Techguns3'
        accessToken = githubToken
        commitish = providers.environmentVariable('GITHUB_SHA').orElse('master')
        tagName = "v${mod_version}"
    }
}

tasks.named('jar', Jar) {
    manifest.attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor' : mod_authors,
    ])
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Show deprecated API uses: they are what breaks on the next Minecraft/NeoForge update
    options.compilerArgs << '-Xlint:deprecation'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
