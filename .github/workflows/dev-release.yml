name: Dev build

# Every push to master: builds, runs the GameTests and replaces the rolling "dev" GitHub pre-release with the new jar
# (mod version <mod_version>-dev.<run number>). Only the latest dev build is kept; real releases use release.yml.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# a newer push supersedes a dev build still running
concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  dev-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build -Puse_mcpfabric=false -Pdev_build=${{ github.run_number }}

      - name: Run GameTests
        run: ./gradlew runGameTestServer -Puse_mcpfabric=false -Pdev_build=${{ github.run_number }}

      - name: Replace the dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/*.jar)
          {
            echo "Automatic test build of \`${GITHUB_SHA::7}\` (run ${{ github.run_number }}). Replaced on every push to master; expect bugs."
            echo
            echo "### Changes since the previous dev build"
            if git rev-parse -q --verify refs/tags/dev >/dev/null; then
              git log --no-merges --format='- %s' -n 50 dev..HEAD
            else
              git log --no-merges --format='- %s' -n 20
            fi
          } > notes.md
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev "$jar" --prerelease --target "$GITHUB_SHA" \
            --title "Dev build ${{ github.run_number }} ($(basename "$jar" .jar))" --notes-file notes.md
