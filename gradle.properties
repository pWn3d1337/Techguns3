# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment Properties
# Latest versions: https://projects.neoforged.net/neoforged/neoforge and https://parchmentmc.org/docs/getting-started
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.264
# Oldest NeoForge the mod declares (tested: CI builds and runs the GameTests on it); JEI and Modern Industrialization need it too
neo_min_version=21.1.238
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Mod Properties
mod_id=techguns
mod_name=Techguns 3
mod_license=Techguns Mod License
mod_version=3.0.0-alpha.1
mod_group_id=techguns
mod_authors=pWn3d

## Release (9g): project ids for publishMods; empty = dry run (tokens come from CURSEFORGE_TOKEN, MODRINTH_TOKEN, GITHUB_TOKEN)
curseforge_project_id=
modrinth_project_id=

## Test dependencies
junit_version=6.1.3

# https://github.com/bernie-g/geckolib - required (design doc Q3)
geckolib_version=4.9.3

# https://github.com/TheIllusiveC4/Curios - optional extra slots (design doc Q5)
curios_version=9.5.1+1.21.1
# https://github.com/mezz/JustEnoughItems - optional recipe viewer (design doc Q9)
jei_version=19.69.0.457
# https://github.com/VazkiiMods/Patchouli and https://github.com/klikli-dev/modonomicon - optional guide book (8d)
patchouli_version=1.21.1-93-neoforge
modonomicon_version=1.21.1-1.120.7

## Dev-only runtime mods (never shipped, never in the published POM)
# MCP Fabric: lets an AI agent observe and control the dev client over a local MCP bridge.
# https://modrinth.com/mod/mcpfabric - set use_mcpfabric=false to disable.
use_mcpfabric=true
mcpfabric_version=0.8.0+1.21.1-neoforge
# Tier 2 compat check (8e): -Pcompat_mods=true adds the mods with conditional Techguns recipes to the dev runtime.
# Modrinth version ids: Create 6.0.10, Mekanism 10.7.19.85, IE 12.4.2-194, Modern Industrialization 2.5.11,
# Oritech 1.2.13 and their required GuideME 21.1.21 (MI), Architectury 13.0.11, Athena 4.0.6 (Oritech).
compat_mods=false
# Team mods (8f1, compileOnly): FTB Teams + FTB Library (maven.ftb.dev; FTB Teams on the dev runtime with compat_mods,
# FTB Library and Architectury always, for its sidebar buttons),
# Open Parties and Claims (Modrinth version id of neoforge-1.21.1-0.33.0; dev runtime with opac=true, not for GameTests)
opac=false
ftb_teams_version=2101.1.11
ftb_library_version=2101.1.38
opac_version=yWmXD7GW
# Lootr (per-player loot chests), opt-in with -Plootr=true to check that Techguns structure chests convert
# (Modrinth version id of 1.21.1-1.11.38.127, the ATM10 version; dev client only)
lootr=false
lootr_version=SPOrIzX8
compat_create=UjX6dr61
compat_mekanism=5KzzycBT
compat_immersiveengineering=uNRARSH2
compat_modern_industrialization=hN58r67E
compat_oritech=BR0KKypH
compat_guideme=JBFCgJmg
compat_architectury_api=1IiqEQGl
compat_athena_ctm=dJgL278E
# Decorative block mods (9i), opt-in with -Pdecor_mods=true: structures use their blocks for the Techguns 2 Chisel blocks,
# Rechiseled gets the Techguns chiseling groups. Modrinth version ids (the versions in All The Mods 10): Rechiseled 1.2.6
# with SuperMartijn642's Core Lib 1.1.26 and Config Lib 1.1.8 and Fusion (below), Chisel Reborn 2.0.1 with Cryonic Config
# 1.0.0 and Architectury (above), Factory Blocks 1.4.0, Laboratory Blocks 0.8.4.
decor_mods=false
decor_rechiseled=6muGRqvu
decor_supermartijn642s_core_lib=HGyYs7Z4
decor_supermartijn642s_config_lib=qKL9jM75
decor_chisel_reborn=4ItA9dOc
decor_cryonicconfig=GW2YX76Y
decor_factory_blocks=7ugThhI5
decor_artemis_laboratory_blocks=aUb1vaDS
# Fusion 1.3.16 (connected textures), always on the dev runtime; Modrinth version id
fusion_version=AYDaLPK8
